version: '3.8'

services:
  # Supabase / PostgreSQL with PostGIS extension for Geospatial farm boundary storage
  db:
    image: postgis/postgis:15-3.3
    container_name: agriverify-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: agriverify_password
      POSTGRES_DB: agriverify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/migrations/002_seed_demo_data.sql:/docker-entrypoint-initdb.d/02_seed.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend: Python FastAPI microservice
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agriverify-backend
    environment:
      - DATABASE_URL=postgresql://postgres:agriverify_password@db:5432/agriverify
      - JWT_SECRET=agriverify_super_secret_jwt_key_2026
      - ENVIRONMENT=development
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Frontend: React + TypeScript + Vite + Tailwind CSS
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agriverify-frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
